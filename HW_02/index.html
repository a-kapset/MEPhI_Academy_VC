<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ночь в музее</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="card">
      <h1 id="event-title">Ночь в музее</h1>
      <p class="meta">15 ноября, 18:30</p>
      <p class="meta">Музей космонавтики, проспект Мира, 111</p>
      <p>Вечерняя программа с выставкой и экскурсиями</p>

      <button id="show-program" class="button" type="button">Показать программу</button>
      <div id="program" class="program" hidden></div>
    </section>

    <p id="data-error" class="error" hidden></p>

    <form id="service-form" class="card form" hidden>
      <h2>Дополнительные услуги</h2>
      <p>
        <label><input type="checkbox" id="guide"> Экскурсия с гидом — 500 руб.</label>
      </p>
      <p>
        <label><input type="checkbox" id="audio"> Аудиогид — 350 руб.</label>
      </p>
      <p>
        <label><input type="checkbox" id="catalog"> Каталог выставки — 250 руб.</label>
      </p>
      <button class="button" type="submit">Рассчитать</button>
      <p id="choice-error" class="error" hidden></p>
    </form>

    <div id="result" class="card result" hidden></div>
    <pre id="report-json" class="json" hidden></pre>
  </main>

  <script src="app.js"></script>
</body>
</html>
